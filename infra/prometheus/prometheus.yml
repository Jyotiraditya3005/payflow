global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: payflow
    environment: development

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:8001"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: fraud-service
    static_configs:
      - targets: ["fraud-service:8003"]
    metrics_path: /metrics

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8000"]
    metrics_path: /metrics

  - job_name: transaction-service
    static_configs:
      - targets: ["transaction-service:8004"]
    metrics_path: /metrics

  - job_name: ledger-service
    static_configs:
      - targets: ["ledger-service:8005"]
    metrics_path: /metrics

  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]
    metrics_path: /actuator/prometheus

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
